name: Scrape ER Wait Times

on:
  schedule:
    # Off the :00 and :30 marks, where GitHub's load is heaviest and runs get dropped
    - cron: "7,37 * * * *"
  # Also started every 30 minutes by an outside cron service, since GitHub's schedule lags by hours
  workflow_dispatch:

# The outside trigger and GitHub's schedule can fire close together; run one scrape at a time
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scheduler.py --once
